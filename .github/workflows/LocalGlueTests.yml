# Runs the sqllogictests against a local Glue (moto) + S3 (MinIO), see scripts/docker-compose.yml and docs/README.md.
#
# A relassert build: DuckDB's assertions and the sanitizers are on, like the build used locally.

name: Local Glue tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  local-glue-tests:
    runs-on: ubuntu-latest

    env:
      GEN: ninja
      # the AWS SDK would otherwise ask the EC2 metadata service for a region, which hangs off EC2
      AWS_EC2_METADATA_DISABLED: "true"
      GLUE_ENDPOINT: http://localhost:5555
      S3_ENDPOINT: localhost:9100

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # the relassert build (debug info + ASAN) and the test data otherwise fill the runner's disk
      - name: Free disk space
        uses: ./duckdb/.github/actions/cleanup_runner

      - uses: docker/setup-compose-action@v1

      - name: Start Glue (moto) and S3 (MinIO)
        run: docker compose -f scripts/docker-compose.yml up -d --wait

      - name: Install build dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build

      - name: Setup Ccache
        uses: ./duckdb/.github/actions/ccache-action
        with:
          # PR caches are only visible to the PR itself; at this size they would evict main's from the 10 GB budget
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: relassert
          build: make relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.2

      # TEMPORARY (diagnose_ci_test_time branch, not for merging): find the ~35s fixed cost per test process on CI
      - name: Diagnose per-test time
        env:
          ASAN_OPTIONS: detect_container_overflow=0
        run: |
          sudo apt-get install -y -qq strace
          printf 'statement ok\nSELECT 1;\n' > test/sql/diag_noop.test
          T=test/sql/hive/attach/verify_connection.test
          UT="./build/relassert/test/unittest --test-config test/configs/local_glue.json"
          run() { echo "::group::$1"; shift; local s=$(date +%s.%N); "$@" > /tmp/out.txt 2>&1; local rc=$?; tail -3 /tmp/out.txt; echo "rc=$rc"; echo "::endgroup::"; echo "TIME $(echo "$(date +%s.%N) - $s" | bc) s"; }
          run "list tests" $UT --list-tests "$T"
          run "noop test (no Glue)" $UT test/sql/diag_noop.test
          run "verify_connection" $UT "$T"
          run "verify_connection again (warm)" $UT "$T"
          run "verify_connection, AWS_REGION set" env AWS_REGION=us-east-1 $UT "$T"
          run "verify_connection, no LeakSanitizer" env ASAN_OPTIONS=detect_container_overflow=0:detect_leaks=0 $UT "$T"
          run "verify_connection, SDK transport" env GLUE_DIAG=1 $UT "$T"
          echo "::group::strace (syscalls blocking > 0.5s)"
          strace -f -tt -T -e trace=connect,poll,ppoll,select,pselect6,epoll_wait,epoll_pwait,nanosleep,clock_nanosleep,futex,read,recvfrom,wait4 \
            -o /tmp/strace.txt $UT "$T" > /dev/null 2>&1
          awk 'match($0, /<([0-9.]+)>$/, m) && m[1] > 0.5' /tmp/strace.txt | head -100
          echo "::endgroup::"
          echo "::group::strace connect() calls"
          grep -E 'connect\(' /tmp/strace.txt | grep -vE 'AF_UNIX' | head -50
          echo "::endgroup::"

      - name: Upload strace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strace
          path: /tmp/strace.txt

      - name: Server logs
        if: always()
        run: docker compose -f scripts/docker-compose.yml logs --no-color moto | tail -200
